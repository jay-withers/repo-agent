name: ci-python

# Runs the test suite, mypy, ruff and both coverage floors on a pull request.
#
# The mechanics live in jay-withers/workflows, so every repo of ours gets the
# same job and a fix lands once. Only what is specific to this repo is here.
#
# This matters most for the changes nobody reads: renovate.json sets
# autoApprove, so a dependency bump reaches main without a human. A pyjwt or
# httpx release that broke the GitHub App token exchange would otherwise merge
# green and fail silently the following Monday.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # `extras: dev` is the input that matters: pytest sits in
    # [project.optional-dependencies] and `uv run` installs dependency groups
    # but not extras, so without it the run fails with a bare "Failed to spawn:
    # pytest" after a successful-looking install — and only in CI, because
    # locally `make install` has already put it in the venv.
    #
    # The interpreter is mise.toml's python (python.yml reads it from mise;
    # python-version only applies without mise), and ci-container-build
    # checks it is the image's, so a pass here is a pass on the interpreter
    # that ships.
    #
    # Deliberately not path filtered: a required check skipped by a path filter
    # never reports, which blocks a pull request rather than passing it.
    uses: jay-withers/workflows/.github/workflows/python.yml@93bff29fb7e15a3669a1f120ab0c3a2940a413d6 # v1.34.0
    with:
      # The package is at the repository root; there is one deliverable and no
      # apps/ nesting to point at.
      working-directory: .
      extras: dev
      coverage: repoagent
      # Both floors fail the check: the total (coverage-min), so the package
      # can't slip, and the lines a PR changes (diff-coverage), so new code
      # comes with its tests. A test that only asserts a mock still counts,
      # so review the tests too. The table is in the job summary; there is
      # no PR comment.
      coverage-min: "90"
      diff-coverage: "90"
      typecheck: mypy
      # ruff check and ruff format --check, from the locked dev extra, so CI
      # runs the ruff `make lint` does.
      lint: true
      # No `postgres` input: this project has no database. That is the whole
      # reason the shared platform carries none.
