name: ci-go

# Runs the checks and the suite on a pull request: gofmt, go vet,
# golangci-lint, `go mod tidy -diff`, the race-enabled suite and both
# coverage floors, all in jay-withers/workflows' go.yml, with Go and
# golangci-lint from mise.toml (GOTOOLCHAIN=local).
#
# The suite includes the parity test: the scan replayed against
# testdata/golden must produce the digest, prompt, query and state document
# the Python implementation produced from the same fixtures before it was
# retired. They are what "no visible change" was measured against.
#
# This matters most for the changes nobody reads: renovate.json sets
# autoApprove, so a dependency bump reaches main without a human. A
# golang-jwt or Azure SDK release that broke the token exchange or the state
# blob would otherwise merge green and fail silently the following Sunday.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job id is the required context's first half: `test / Test`, set in
  # github-repos. Deliberately not path filtered: a required check skipped by
  # a path filter never reports, which blocks a pull request rather than
  # passing it.
  test:
    uses: jay-withers/workflows/.github/workflows/go.yml@ca86e90ed1f90f0afae1c2f2fc5a20c3a2115287 # v1.35.0
    with:
      coverage: true
      # Both floors fail the check: the total, so the module can't slip, and
      # the lines a PR changes, so new code comes with its tests. The table is
      # in the job summary; there is no PR comment.
      coverage-min: "90"
      diff-coverage: "90"
