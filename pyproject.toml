[project]
name = "repoagent"
version = "0.1.0"
description = "Scans GitHub repositories for improvements and checks Renovate is working, then emails a digest"
requires-python = ">=3.12"

# One package, one image, two entrypoints (scan, render). Dependencies are added
# as the modules that need them land rather than declared up front. The triage
# step has now landed and added nothing: DeepSeek's API is OpenAI-compatible, so
# `llm.py` is one `fetch.post_json` call and needs no SDK at all.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  # Secret resolution (env, then .env, then Key Vault) and the Azure
  # credential, from jay-withers/appkit. `azure` brings azure-identity,
  # azure-keyvault-secrets and python-dotenv; no web framework. The tag is
  # in [tool.uv.sources] below.
  "appkit[azure]",
  # The scan's history: one JSON document, read and written whole once a week.
  "azure-storage-blob>=12.23",
  "httpx>=0.28",
  # GitHub App authentication signs an RS256 JWT, which needs the crypto extra —
  # PyJWT alone ships only the HMAC algorithms and fails at runtime with
  # "Algorithm 'RS256' could not be found".
  "pyjwt[crypto]>=2.9",
  # Telemetry. The distro brings the exporter plus logging and Azure SDK
  # instrumentation; httpx is separate because the distro does not carry it, and
  # it is what turns the GitHub and Resend calls into dependency spans.
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-httpx>=0.50b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=2.4.1",
]

# What the Dockerfile's ENTRYPOINT resolves to. Terraform deliberately does not
# repeat this name — see cli.py.
[project.scripts]
repoagent = "repoagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# appkit comes from a git tag (the builder image carries git for it). Set
# here rather than as `appkit @ git+...` in dependencies: Renovate reads a
# uv git source's tag and raises the bump with `uv lock`, but skips a
# PEP 508 direct reference.
[tool.uv.sources]
appkit = { git = "https://github.com/jay-withers/appkit", tag = "v0.8.5" }

[tool.hatch.build.targets.wheel]
packages = ["src/repoagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # import sorting
  "UP",      # pyupgrade
  "B",       # bugbear
  "SIM",     # simplify
  "RUF",
  "S",       # bandit security rules: fail the commit, not just the PR
]

# Test code is exempt from the bandit rules that only make sense in shipped
# code: pytest is built on `assert` (S101), fixtures use dummy tokens (S105,
# S106) and loopback binds (S104), and a test may shell out on purpose (S603,
# S607). Everything else under "S" still applies to tests.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607"]

[tool.mypy]
# `make typecheck` and CI's `typecheck: mypy` both read this. Tests too, so a
# changed signature can't leave a stale call behind in them. check_untyped_defs
# so a function without annotations is still checked inside; the pydantic
# plugin so a model built with a field it doesn't have is caught.
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# init_forbid_extra makes the plugin reject an unknown field, and init_typed
# checks each field's type at the call, rather than leaving it to pydantic's
# runtime validation.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A warning here is a defect: this process runs unattended once a week, so
# anything worth warning about is something nobody will be reading the logs to
# see.
filterwarnings = ["error"]
