# Tool versions for this repo. Locally: run jay-withers/toolchain's setup.sh
# once per machine, then `mise install` here. CI installs the same versions
# (jay-withers/workflows v1.26.1+), and Renovate keeps them current.

[tools]
# Runs pre-commit and its Python hooks. The app is Go, so nothing else uses it.
python = "3.15.2"
pre-commit = "4.7.0"
# actionlint lints workflow run: blocks with it, and silently skips them without it.
shellcheck = "0.11.0"
terraform = "1.17.2"
tflint = "0.66.0"
terraform-docs = "0.25.1"
checkov = "3.4.5"
# The app. workflows' go.yml and codeql.yml take Go from here with
# GOTOOLCHAIN=local, and the Dockerfile's golang builder tag must be this
# exact version (Renovate moves the two together).
go = "1.27.4"
golangci-lint = "2.15.0"
